name: Release

# Push a tag like v0.2.0 to build eStatement.app and attach it to a GitHub release.
# "Run workflow" (manual) builds and uploads the zip as an artifact without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-app:
    runs-on: macos-latest # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Only what the app bundles: core + MLX OCR runtime + native window (+ PyInstaller from dev group).
      - run: uv sync --locked --extra vlm --extra app

      - name: Check and test
        run: |
          uv run ruff check .
          uv run pytest -q

      - name: Build eStatement.app
        working-directory: packaging
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run pyinstaller estatement.spec --noconfirm --distpath ../dist --workpath ../build

      - name: Smoke test the bundle
        run: |
          uv run python packaging/smoke_test.py dist/eStatement.app

      - name: Zip
        id: zip
        run: |
          v="${{ steps.version.outputs.version }}"
          full="eStatement-$v-macos-arm64.zip"
          # ditto keeps symlinks and code signatures intact inside the .app
          ditto -c -k --sequesterRsrc --keepParent dist/eStatement.app "$full"
          shasum -a 256 "$full" > "$full.sha256"
          du -h "$full"
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: eStatement-${{ steps.version.outputs.version }}-macos-arm64
          path: |
            ${{ steps.zip.outputs.full }}
            ${{ steps.zip.outputs.full }}.sha256

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **eStatement for macOS (Apple Silicon).** Parses bank e-statement PDFs into SQLite/CSV, fully on-device.

          **Install:** unzip, move `eStatement.app` to Applications. The app is not notarized, so on first launch
          right-click it and choose **Open** (or run `xattr -dr com.apple.quarantine /Applications/eStatement.app`).

          **OCR for image-only PDFs (e.g. HSBC):** the app offers a one-time download of
          the OCR model (about 2 GB from Hugging Face, pinned by SHA-256) the first time a statement needs it.
          Parsing itself never uses the network.

          Verify the download with the attached `.sha256` file.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.zip.outputs.full }}" "${{ steps.zip.outputs.full }}.sha256" \
            --title "eStatement ${{ steps.version.outputs.version }}" \
            --notes-file notes.md --verify-tag
